name: Refresh observed city data

on:

  push:
  
    paths: ['.github/workflows/refresh-data.yml','scripts/*.py']
    
  schedule:
  
    - cron: '57 5 * * 1'
    
  workflow_dispatch:
  
permissions:

  contents: write
  
  issues: write
  
jobs:

  refresh:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
      
        with: {python-version: '3.12'}
        
      - run: python scripts/refresh_observed.py
      
      - run: python scripts/fix_site.py
      
      - run: python scripts/check_alerts.py
      
      - run: |
      
          git config user.name github-actions[bot]
          
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
          git add scripts data index.html
          
          git diff --cached --quiet || git commit -m 'data: automated refresh'
          
          git push
          
      - if: failure()
      
        env:
        
          GH_TOKEN: ${{ github.token }}
          
        run: |
        
          title='Data pipeline alert'
          
          body="Automated refresh or validation failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi




























